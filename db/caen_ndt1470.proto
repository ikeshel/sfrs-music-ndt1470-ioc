# CAEN NDT1470 ASCII protocol for StreamDevice
#
# Protocol arguments:
#   \$1 = two-digit local-bus address, e.g. 00
#   \$2 = CAEN channel number, 0..3

Terminator = CR LF;
ReplyTimeout = 2000;
ReadTimeout = 2000;
WriteTimeout = 2000;
LockTimeout = 5000;
ExtraInput = Ignore;


setEnable {
    InTerminator = "";
    ReadTimeout = 100;

    out 0x24 "BD:\$1,CMD:SET,CH:\$2,PAR:%{OFF|ON}";
    in "#BD:\$1,CMD:OK\n\r";
}

getVMon {
    out 0x24 "BD:\$1,CMD:MON,CH:\$2,PAR:VMON";
    in  "#BD:\$1,CMD:OK,VAL:%f";
}

getVSet {
    out 0x24 "BD:\$1,CMD:MON,CH:\$2,PAR:VSET";
    in  "#BD:\$1,CMD:OK,VAL:%f";
}

setVSet {
    # This NDT1470 firmware terminates SET acknowledgements with LF CR,
    # while MON replies use CR LF.
    InTerminator = "";
    ReadTimeout = 100;

    out 0x24 "BD:\$1,CMD:SET,CH:\$2,PAR:VSET,VAL:%.1f";
    in  "#BD:\$1,CMD:OK\n\r";

    out 0x24 "BD:\$1,CMD:MON,CH:\$2,PAR:VSET";
    in  "#BD:\$1,CMD:OK,VAL:%f\r\n";

    @init {
        out 0x24 "BD:\$1,CMD:MON,CH:\$2,PAR:VSET";
        in  "#BD:\$1,CMD:OK,VAL:%f\r\n";
    }
}

getISet {
    out 0x24 "BD:\$1,CMD:MON,CH:\$2,PAR:ISET";
    in  "#BD:\$1,CMD:OK,VAL:%f";
}

setISet {
    InTerminator = "";
    ReadTimeout = 100;

    out 0x24 "BD:\$1,CMD:SET,CH:\$2,PAR:ISET,VAL:%.2f";
    in  "#BD:\$1,CMD:OK\n\r";

    out 0x24 "BD:\$1,CMD:MON,CH:\$2,PAR:ISET";
    in  "#BD:\$1,CMD:OK,VAL:%f\r\n";

    @init {
        out 0x24 "BD:\$1,CMD:MON,CH:\$2,PAR:ISET";
        in  "#BD:\$1,CMD:OK,VAL:%f\r\n";
    }
}

getIMon {
    out 0x24 "BD:\$1,CMD:MON,CH:\$2,PAR:IMON";
    in  "#BD:\$1,CMD:OK,VAL:%f";
}

getStatus {
    out 0x24 "BD:\$1,CMD:MON,CH:\$2,PAR:STAT";
    in  "#BD:\$1,CMD:OK,VAL:%d";
}

