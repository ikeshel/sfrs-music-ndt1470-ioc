# CAEN NDT1470 ASCII protocol for StreamDevice
#
# Protocol arguments:
#   \$1 = two-digit local-bus address, e.g. 00
#   \$2 = CAEN channel number, 0..3

Terminator = CR LF;
ReplyTimeout = 2000;
ReadTimeout = 2000;
WriteTimeout = 2000;
LockTimeout = 5000;
ExtraInput = Ignore;

getVMon {
    out 0x24 "BD:\$1,CMD:MON,CH:\$2,PAR:VMON";
    in  "#BD:\$1,CMD:OK,VAL:%f";
}

getVSet {
    out 0x24 "BD:\$1,CMD:MON,CH:\$2,PAR:VSET";
    in  "#BD:\$1,CMD:OK,VAL:%f";
}

setVSet {
    out 0x24 "BD:\$1,CMD:SET,CH:\$2,PAR:VSET,VAL:%.1f";
    in  "#BD:\$1,CMD:OK";
    out 0x24 "BD:\$1,CMD:MON,CH:\$2,PAR:VSET";
    in  "#BD:\$1,CMD:OK,VAL:%f";

    @init {
        out 0x24 "BD:\$1,CMD:MON,CH:\$2,PAR:VSET";
        in  "#BD:\$1,CMD:OK,VAL:%f";
    }
}

getISet {
    out 0x24 "BD:\$1,CMD:MON,CH:\$2,PAR:ISET";
    in  "#BD:\$1,CMD:OK,VAL:%f";
}

setISet {
    out 0x24 "BD:\$1,CMD:SET,CH:\$2,PAR:ISET,VAL:%.2f";
    in  "#BD:\$1,CMD:OK";
    out 0x24 "BD:\$1,CMD:MON,CH:\$2,PAR:ISET";
    in  "#BD:\$1,CMD:OK,VAL:%f";

    @init {
        out 0x24 "BD:\$1,CMD:MON,CH:\$2,PAR:ISET";
        in  "#BD:\$1,CMD:OK,VAL:%f";
    }
}

getIMon {
    out 0x24 "BD:\$1,CMD:MON,CH:\$2,PAR:IMON";
    in  "#BD:\$1,CMD:OK,VAL:%f";
}

getStatus {
    out 0x24 "BD:\$1,CMD:MON,CH:\$2,PAR:STAT";
    in  "#BD:\$1,CMD:OK,VAL:%d";
}
